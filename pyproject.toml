[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fixed-points"
version = "0.1.0"
description = "LLM-driven code improvement agent that iterates toward a fix point"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [
    { name = "Hugo Bacard", email = "hugo.bacard@ijclab.in2p3.fr" },
]
keywords = ["llm", "code-improvement", "agent", "pydantic-ai", "langfuse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic-ai>=2.70.0",
    "python-dotenv>=1.2.4",
    "langfuse>=5.2.0",
]

[project.scripts]
ai-fixed-points = "ai_fixed_points.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_fixed_points*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=ai_fixed_points --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["ai_fixed_points"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
