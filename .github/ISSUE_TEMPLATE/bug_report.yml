name: Bug report
description: Report a problem with ai-fixed-points
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill in as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Version
      description: Version of ai-fixed-points you are using (e.g. 0.1.0) or commit hash.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a code snippet to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, package manager (uv/PDM), and any relevant config.
      placeholder: |
        - OS: Ubuntu 24.04
        - Python: 3.13
        - Package manager: uv
    validations:
      required: false
