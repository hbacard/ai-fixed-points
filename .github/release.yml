# GitHub Release template and generation settings.
# This file drives the autogenerated changelog shown when opening a new
# Release. Categories map PR labels to sections of the release notes.
# Reference: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - documentation
    authors:
      - dependabot[bot]
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 🔧 Maintenance
      labels:
        - chore
        - refactor
        - dependencies
    - title: 📝 Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
