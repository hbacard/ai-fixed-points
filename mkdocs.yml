site_name: ai-fixed-points
site_description: LLM-driven code improvement agent that iterates toward a fixed point.
site_url: https://github.com/hbacard/ai-fixed-points
repo_url: https://github.com/hbacard/ai-fixed-points
repo_name: hbacard/ai-fixed-points
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference: api.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hbacard/ai-fixed-points
